services:
  # 1. Database PostgreSQL + PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: gps_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: GPSTrackerDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gps_tracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend (ASP.NET Core)
  backend:
    build:
      context: ./GPSTracker.Backend
      dockerfile: Dockerfile
    container_name: gps_tracker_backend
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=GPSTrackerDB;Username=postgres;Password=Password123!
      - ConnectionStrings__RedisConnection=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 4. Frontend (React + Vite) chạy qua Docker (Production Nginx)
  frontend:
    build:
      context: ./GPSTracker.Frontend
      dockerfile: Dockerfile
    container_name: gps_tracker_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
